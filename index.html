<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h1>To-Do List <img src="book.jpg" alt="Book Icon"></h1>

    <div class="task-adder">
      <input type="text" placeholder="Add Your Task" required>
      <button onclick="addtask()">ADD</button>
    </div>

    <div class="tasks">
      <div class="task" onclick="comp(this)" >
        <div class="checkbox" ></div>
        <h3 class="tt">Learn JavaScript.</h3>
        <div class="cb">&times;</div>
      </div>
      <div class="task" onclick="comp(this)">
        <div class="checkbox"></div>
        <h3 class="tt">Practice Projects.</h3>
        <div class="cb">&times;</div>
      </div>
    
  <script src="script.js"></script>
</body>
</html>
